// taihu 远程访问层协议定义（设计文档_v3 §3）。
// Put client 流式上传（首帧带 key+size）；Get server 流式下发（支持 off/size 区间，size=-1 全量）。
//
// 注意：Get/Put 的【数据帧】在 wire 上为裸字节流（经 taihu-raw 自定义 codec 零拷贝透传，
// 即 SendMsg/RecvMsg 直接收发 []byte），不再是 GetChunk/PutChunk 的 message 编码。
// 下方 PutChunk/GetChunk 消息保留作为逻辑 schema 与 header 帧（PutChunk 首帧）使用。
syntax = "proto3";

package taihu.rpc;

option go_package = "github.com/liucxer/taihu/rpc";

// ObjectStore 对象存储远程服务。
service ObjectStore {
  // Put 上传对象：首帧携带 header{key,size}，其后为数据块；EOF 结束流。
  rpc Put(stream PutChunk) returns (PutResp);
  // Get 下载对象区间：off/size 相对对象起始，size=-1 表示读到对象结尾。
  rpc Get(GetReq) returns (stream GetChunk);
  // Delete 删除对象映射。
  rpc Delete(DeleteReq) returns (DeleteResp);
  // Stat 返回对象逻辑大小。
  rpc Stat(StatReq) returns (StatResp);
}

message PutChunk {
  PutHeader header = 1; // 仅首帧非空；其余帧 header 为空
  bytes     data   = 2; // 数据块（≤ 256KB）
}

message PutHeader {
  string key  = 1;
  int64  size = 2; // 对象逻辑大小（字节），0 <= size <= SegmentSizeBytes
}

message PutResp {}

message GetReq {
  string key  = 1;
  int64  off  = 2; // 相对对象起始偏移，>= 0
  int64  size = 3; // -1 = 读到结尾；否则 0 <= size 且 off+size <= 对象 Size
}

message GetChunk { bytes data = 1; }

message DeleteReq { string key = 1; }
message DeleteResp {}

message StatReq { string key = 1; }
message StatResp { int64 size = 1; }